name: 'RoleCraft Action'
description: 'Install and verify AI agent skills in CI with rolecraft'
author: 'rolecraft-sh'
branding:
  icon: 'terminal'
  color: 'blue'
inputs:
  command:
    description: 'RoleCraft command to run (e.g. "ci --yes", "verify"). Ignored when script is provided. Do NOT pass untrusted data like PR titles/body.'
    required: false
  script:
    description: 'Shell script to run with rolecraft pre-installed. Alternative to command — when provided, command is ignored. Do NOT pass untrusted data like PR titles/body.'
    required: false
  version:
    description: 'RoleCraft version to use (e.g. "latest", "1.6.0")'
    required: false
    default: 'latest'
runs:
  using: 'node20'
  main: 'index.js'
